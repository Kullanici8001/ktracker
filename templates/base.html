<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}KTracker{% endblock %}</title>
  <meta name="description" content="{% block description %}Google Sheets-based music tracker viewer{% endblock %}">
  <meta name="theme-color" content="#2ca869">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
  {% block pagecss %}{% endblock %}
  <style>
    /* ── Custom Audio Player (Global Sticky Bottom - Matching Image 1) ── */
    .Player_player__Lp72A {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      width: 100%;
      height: 90px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      align-items: center;
      gap: 20px;
      color: white;
      background-color: rgb(11, 11, 13);
      box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      user-select: none;
    }

    .Player_info__PCFRT {
      gap: 12px;
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .Player_cover__zyHrw {
      width: 52px;
      height: 52px;
      border-radius: 4px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .Player_title__dDcQD {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .Player_artists__aka37 {
      font-size: 12px;
      color: rgb(200, 200, 200);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .Player_center__controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
    }

    .Player_buttons__F8lxF {
      gap: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-btn {
      background: none;
      border: none;
      color: #b3b3b3;
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, transform 0.1s;
      position: relative;
    }

    .player-btn:hover {
      color: #ffffff;
      transform: scale(1.08);
    }

    .player-btn.active {
      color: #1db954 !important;
    }

    .player-play-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #ffffff;
      color: #000000;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.15s;
    }

    .player-play-circle:hover {
      transform: scale(1.06);
      background: #f0f0f0;
    }

    .Player_slider__Rxlnz {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .player-time {
      font-size: 11.5px;
      color: #a7a7a7;
      min-width: 34px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .player-progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }

    /* Range slider custom styling */
    .player-range-input {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(to right, #ffffff var(--progress, 0%), rgba(255, 255, 255, 0.25) var(--progress, 0%));
      outline: none;
      cursor: pointer;
      transition: height 0.1s;
    }

    .player-range-input:hover {
      height: 6px;
    }

    .player-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .player-range-input::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      border: none;
      cursor: pointer;
    }

    .Player_right__actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
    }

    .player-volume-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-volume-input {
      -webkit-appearance: none;
      appearance: none;
      width: 75px;
      height: 4px;
      border-radius: 2px;
      background: linear-gradient(to right, #ffffff var(--vol-progress, 100%), rgba(255, 255, 255, 0.25) var(--vol-progress, 100%));
      outline: none;
      cursor: pointer;
    }

    .player-volume-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
    }

    /* Context Menu */
    .Menu_menu__dGGWo {
      position: fixed;
      min-width: 180px;
      max-width: 320px;
      padding: 6px;
      border-radius: 6px;
      background-color: var(--dark-secondary, rgb(24, 24, 24));
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 100000;
    }

    .Menu_menuItem__Y3fvW {
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      color: #fff;
      font-size: 13.5px;
      user-select: none;
      transition: background-color 0.12s;
    }

    .Menu_menuItem__Y3fvW:hover {
      background-color: rgba(255, 255, 255, 0.1) !important;
    }

    @media screen and (max-width: 800px) {
      .Player_player__Lp72A {
        grid-template-columns: 1fr auto;
        height: auto;
        padding: 10px 14px;
        gap: 10px;
      }

      .Player_center__controls {
        grid-column: 1 / -1;
        order: 2;
      }

      .player-volume-wrap {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="__next">
    <div class="_app_viewport__qiA88">
      <div id="scrollable" class="_app_scrollable__CPTC5">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <!-- Global Custom Audio Player (Matching TrackerHub / Image 1) -->
  <div id="global-custom-player" class="Player_player__Lp72A" style="display: none;">
    <!-- Left: Track info & cover -->
    <div class="Player_info__PCFRT">
      <img id="player-cover-img" class="Player_cover__zyHrw" src="/static/img/logo.webp" alt="Cover"
        style="display:none;">
      <div id="player-cover-placeholder" class="Player_cover__zyHrw"
        style="display:flex;align-items:center;justify-content:center;background:#222;font-size:22px;">🎵</div>
      <div style="min-width:0;flex:1;">
        <div id="player-track-name" class="Player_title__dDcQD" title="Track Name">Loading Track...</div>
        <div id="player-track-artist" class="Player_artists__aka37" title="Artists"></div>
      </div>
    </div>

    <!-- Center: Controls & Seek Slider -->
    <div class="Player_center__controls">
      <!-- Buttons row -->
      <div class="Player_buttons__F8lxF">
        <!-- Shuffle -->
        <button id="player-shuffle-btn" class="player-btn" title="Shuffle" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
          </svg>
        </button>
        <!-- Prev -->
        <button id="player-prev-btn" class="player-btn" title="Previous Track" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
          </svg>
        </button>
        <!-- Play / Pause Circular White Button -->
        <button id="player-play-btn" class="player-play-circle" title="Play / Pause" type="button">
          <svg id="player-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
            style="display:none;margin-left:2px;">
            <path d="M8 5v14l11-7z" />
          </svg>
          <svg id="player-pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
            style="display:block;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
          </svg>
        </button>
        <!-- Next -->
        <button id="player-next-btn" class="player-btn" title="Next Track" type="button">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
          </svg>
        </button>
        <!-- Repeat -->
        <button id="player-repeat-btn" class="player-btn" title="Repeat (Off)" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
          </svg>
          <span id="player-repeat-badge"
            style="display:none;position:absolute;font-size:9px;font-weight:700;top:-2px;right:-2px;background:#1db954;color:#000;border-radius:50%;width:12px;height:12px;line-height:12px;text-align:center;">1</span>
        </button>
      </div>

      <!-- Slider row -->
      <div class="Player_slider__Rxlnz">
        <span id="player-current-time" class="player-time">0:00</span>
        <div class="player-progress-wrap">
          <input type="range" id="player-progress-bar" min="0" max="100" value="0" step="0.1"
            class="player-range-input">
        </div>
        <span id="player-duration" class="player-time">0:00</span>
      </div>
    </div>

    <!-- Right: Volume & Actions -->
    <div class="Player_right__actions">
      <div class="player-volume-wrap">
        <button id="player-vol-btn" class="player-btn" title="Mute/Unmute" type="button">
          <svg id="player-vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
          </svg>
        </button>
        <input type="range" id="player-volume-bar" min="0" max="1" step="0.01" value="1" class="player-volume-input">
      </div>
      <button id="player-close-btn" class="player-btn" onclick="closePlayer()" title="Close Player"
        type="button">✕</button>
    </div>

    <!-- Hidden native audio element -->
    <audio id="global-audio-el" preload="auto"></audio>
  </div>

  <!-- Custom Context Menu (Matching TrackerHub / Image 2) -->
  <div id="custom-context-menu" class="Menu_menu__dGGWo" style="display:none;">
    <div class="Menu_menuItem__Y3fvW" id="ctx-copy-link">
      <span id="ctx-copy-text">Copy Link</span>
    </div>
    <div class="Menu_menuItem__Y3fvW" id="ctx-open-url">
      <span>Open Original URL</span>
    </div>
    <div class="Menu_menuItem__Y3fvW" id="ctx-download">
      <span id="ctx-download-text">Download</span>
    </div>
  </div>

  <script>
    // ── Ultra-Fast Delegated Mouse Coordinates (For Tooltips) ──
    document.addEventListener('mousemove', function (e) {
      const tooltipEl = e.target.closest('.Tooltip_tooltip__awbme');
      if (tooltipEl && tooltipEl.getAttribute('data-content')) {
        tooltipEl.style.setProperty('--mouse-x', e.clientX + 'px');
        tooltipEl.style.setProperty('--mouse-y', e.clientY + 'px');
      }
    }, { passive: true });

    // ── Audio Player State & Setup ──
    const globalAudioEl = document.getElementById('global-audio-el');
    const customPlayerEl = document.getElementById('global-custom-player');
    const playBtn = document.getElementById('player-play-btn');
    const playIcon = document.getElementById('player-play-icon');
    const pauseIcon = document.getElementById('player-pause-icon');
    const progressBar = document.getElementById('player-progress-bar');
    const currentTimeEl = document.getElementById('player-current-time');
    const durationEl = document.getElementById('player-duration');
    const shuffleBtn = document.getElementById('player-shuffle-btn');
    const repeatBtn = document.getElementById('player-repeat-btn');
    const repeatBadge = document.getElementById('player-repeat-badge');
    const prevBtn = document.getElementById('player-prev-btn');
    const nextBtn = document.getElementById('player-next-btn');
    const volBtn = document.getElementById('player-vol-btn');
    const volBar = document.getElementById('player-volume-bar');

    let isShuffle = false;
    let repeatMode = 'off'; // 'off' | 'all' | 'one'
    let currentTrackIndex = -1;
    let isSeeking = false;
    let lastVolume = 1;

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function updatePlayPauseUI(isPlaying) {
      if (isPlaying) {
        playIcon.style.display = 'none';
        pauseIcon.style.display = 'block';
      } else {
        playIcon.style.display = 'block';
        pauseIcon.style.display = 'none';
      }
    }

    function closePlayer() {
      if (globalAudioEl) {
        globalAudioEl.pause();
        globalAudioEl.src = '';
        globalAudioEl.removeAttribute('data-original-url');
      }
      if (customPlayerEl) {
        customPlayerEl.style.display = 'none';
      }
      clearPlayingTrack();
      try {
        localStorage.removeItem('ktracker_current_playing_track');
        localStorage.removeItem('ktracker_played_tracks');
      } catch (e) { }
    }

    const AUDIO_EXTS = /\.(mp3|ogg|wav|flac|m4a|aac|opus)(\?.*)?$/i;

    function isPlayableAudio(url) {
      if (!url) return false;
      if (AUDIO_EXTS.test(url)) return true;
      return ['discord', 'discordapp', 'gofile', 'catbox', 'pixeldrain', 'pillowcase', 'pillows'].some(h => url.includes(h));
    }

    // ── Current Playing Track Indicator ──
    function getCurrentPlayingTrack() {
      try {
        const item = localStorage.getItem('ktracker_current_playing_track');
        return item ? JSON.parse(item) : null;
      } catch (e) {
        return null;
      }
    }

    function clearPlayingTrack() {
      document.querySelectorAll('.Track_track__b2YEg.is-played, .track-title.is-played').forEach(el => {
        el.classList.remove('is-played');
      });
    }

    function markPlayed(url, title) {
      if (!url && !title) return;
      try {
        localStorage.setItem('ktracker_current_playing_track', JSON.stringify({
          url: url || '',
          title: title || ''
        }));
        localStorage.removeItem('ktracker_played_tracks');
      } catch (e) { }

      applyPlayedState(url, title);
    }

    function applyPlayedState(url, title) {
      clearPlayingTrack();
      if (!url && !title) return;

      document.querySelectorAll('.Track_track__b2YEg').forEach(el => {
        const elUrl = el.getAttribute('data-audio-url');
        const titleEl = el.querySelector('.track-title') || el.querySelector('span');
        const elTitle = (el.getAttribute('data-track-name') || titleEl?.textContent || '').trim();

        if ((url && elUrl === url) || (title && elTitle === title)) {
          el.classList.add('is-played');
          if (titleEl) {
            titleEl.classList.add('is-played');
          }
        }
      });
    }

    function restorePlayedTracks() {
      const current = getCurrentPlayingTrack();
      if (!current) return;
      if (current.url || current.title) {
        applyPlayedState(current.url, current.title);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', restorePlayedTracks);
    } else {
      restorePlayedTracks();
    }

    // ── Playlist / Auto-advance Next Track ──
    function getPlayableTracksOnPage() {
      return Array.from(document.querySelectorAll('.Track_track__b2YEg[data-audio-url]'));
    }

    function playNextTrack() {
      const tracks = getPlayableTracksOnPage();
      if (!tracks.length) return;

      if (repeatMode === 'one') {
        if (globalAudioEl) {
          globalAudioEl.currentTime = 0;
          globalAudioEl.play();
        }
        return;
      }

      let nextIndex = 0;
      if (isShuffle && tracks.length > 1) {
        do {
          nextIndex = Math.floor(Math.random() * tracks.length);
        } while (nextIndex === currentTrackIndex && tracks.length > 1);
      } else {
        const currentUrl = globalAudioEl?.getAttribute('data-original-url');
        let foundIdx = tracks.findIndex(t => t.getAttribute('data-audio-url') === currentUrl);
        if (foundIdx === -1) foundIdx = currentTrackIndex;

        if (foundIdx >= 0 && foundIdx + 1 < tracks.length) {
          nextIndex = foundIdx + 1;
        } else if (repeatMode === 'all') {
          nextIndex = 0;
        } else {
          // End of playlist
          return;
        }
      }

      currentTrackIndex = nextIndex;
      const nextTrack = tracks[nextIndex];
      if (nextTrack) {
        const url = nextTrack.getAttribute('data-audio-url');
        playOrOpen(url, nextTrack);
      }
    }

    function playPrevTrack() {
      if (globalAudioEl && globalAudioEl.currentTime > 3) {
        globalAudioEl.currentTime = 0;
        return;
      }

      const tracks = getPlayableTracksOnPage();
      if (!tracks.length) return;

      const currentUrl = globalAudioEl?.getAttribute('data-original-url');
      let foundIdx = tracks.findIndex(t => t.getAttribute('data-audio-url') === currentUrl);
      if (foundIdx === -1) foundIdx = currentTrackIndex;

      let prevIndex = foundIdx - 1;
      if (prevIndex < 0) {
        prevIndex = tracks.length - 1;
      }

      currentTrackIndex = prevIndex;
      const prevTrack = tracks[prevIndex];
      if (prevTrack) {
        const url = prevTrack.getAttribute('data-audio-url');
        playOrOpen(url, prevTrack);
      }
    }

    // ── Play / Open Core Handler ──
    async function playOrOpen(url, trackEl) {
      if (!url || url === '#' || url.toLowerCase() === 'n/a') return;

      const nameEl = document.getElementById('player-track-name');
      const artistEl = document.getElementById('player-track-artist');
      const coverImg = document.getElementById('player-cover-img');
      const coverPlaceholder = document.getElementById('player-cover-placeholder');

      let title = trackEl?.getAttribute('data-track-name') || trackEl?.querySelector('.track-title')?.textContent?.trim() || 'Audio Track';
      let artists = trackEl?.getAttribute('data-track-artists') || trackEl?.querySelector('.Track_artists__94fRt')?.textContent?.trim() || '';

      // Find era cover if present
      let coverUrl = trackEl?.closest('.EraCard_era__RaoRE')?.querySelector('.EraCard_cover__huWx9')?.getAttribute('src') || '';
      if (coverUrl) {
        coverImg.src = coverUrl;
        coverImg.style.display = 'block';
        coverPlaceholder.style.display = 'none';
      } else {
        coverImg.style.display = 'none';
        coverPlaceholder.style.display = 'flex';
      }

      nameEl.textContent = title + ' (Loading...)';
      artistEl.textContent = artists;
      customPlayerEl.style.display = 'grid';

      let streamUrl = url;

      // Resolve via backend
      try {
        const res = await fetch('/api/resolve?url=' + encodeURIComponent(url));
        if (res.ok) {
          const data = await res.json();
          if (data.resolved && data.resolved !== url) {
            streamUrl = data.resolved;
          }
        }
      } catch (err) {
        console.warn('Backend resolve error:', err);
      }

      // pillows fallback
      const pillowsMatch = streamUrl.match(/(?:pillows\.su|pillowcase\.su)\/f\/([a-zA-Z0-9_-]+)/);
      if (pillowsMatch) {
        streamUrl = `https://api.pillows.su/api/download/${pillowsMatch[1]}`;
      }

      const imgurMatch = url.match(/imgur\.gg\/[a-zA-Z0-9_-]+/);
      const canPlay = isPlayableAudio(streamUrl) || imgurMatch || pillowsMatch;

      if (canPlay) {
        nameEl.textContent = title;
        artistEl.textContent = artists;
        globalAudioEl.setAttribute('data-original-url', url);
        globalAudioEl.src = streamUrl;

        markPlayed(url, title);
        globalAudioEl.play().catch(e => {
          console.log('Autoplay prevented:', e);
          updatePlayPauseUI(false);
        });
      } else {
        customPlayerEl.style.display = 'none';
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    // ── Audio Event Listeners ──
    if (globalAudioEl) {
      globalAudioEl.addEventListener('play', function () {
        updatePlayPauseUI(true);
        const nameEl = document.getElementById('player-track-name');
        const currentTitle = nameEl ? nameEl.textContent.replace(' (Loading...)', '').trim() : '';
        const currentUrl = globalAudioEl.getAttribute('data-original-url');
        markPlayed(currentUrl, currentTitle);
      });

      globalAudioEl.addEventListener('pause', function () {
        updatePlayPauseUI(false);
      });

      globalAudioEl.addEventListener('timeupdate', function () {
        if (!isSeeking && globalAudioEl.duration) {
          const pct = (globalAudioEl.currentTime / globalAudioEl.duration) * 100;
          progressBar.value = pct;
          progressBar.style.setProperty('--progress', pct + '%');
          currentTimeEl.textContent = formatTime(globalAudioEl.currentTime);
        }
      });

      globalAudioEl.addEventListener('loadedmetadata', function () {
        durationEl.textContent = formatTime(globalAudioEl.duration);
      });

      globalAudioEl.addEventListener('ended', function () {
        playNextTrack();
      });
    }

    // ── Controls Click Handlers ──
    if (playBtn) {
      playBtn.addEventListener('click', function () {
        if (!globalAudioEl.src) return;
        if (globalAudioEl.paused) {
          globalAudioEl.play();
        } else {
          globalAudioEl.pause();
        }
      });
    }

    if (progressBar) {
      progressBar.addEventListener('input', function () {
        isSeeking = true;
        const pct = this.value;
        this.style.setProperty('--progress', pct + '%');
        if (globalAudioEl.duration) {
          currentTimeEl.textContent = formatTime((pct / 100) * globalAudioEl.duration);
        }
      });

      progressBar.addEventListener('change', function () {
        if (globalAudioEl.duration) {
          globalAudioEl.currentTime = (this.value / 100) * globalAudioEl.duration;
        }
        isSeeking = false;
      });
    }

    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', function () {
        isShuffle = !isShuffle;
        this.classList.toggle('active', isShuffle);
        this.title = isShuffle ? 'Shuffle (On)' : 'Shuffle (Off)';
      });
    }

    if (repeatBtn) {
      repeatBtn.addEventListener('click', function () {
        if (repeatMode === 'off') {
          repeatMode = 'all';
          this.classList.add('active');
          repeatBadge.style.display = 'none';
          this.title = 'Repeat (All)';
        } else if (repeatMode === 'all') {
          repeatMode = 'one';
          this.classList.add('active');
          repeatBadge.style.display = 'block';
          this.title = 'Repeat (One)';
        } else {
          repeatMode = 'off';
          this.classList.remove('active');
          repeatBadge.style.display = 'none';
          this.title = 'Repeat (Off)';
        }
      });
    }

    if (prevBtn) prevBtn.addEventListener('click', playPrevTrack);
    if (nextBtn) nextBtn.addEventListener('click', playNextTrack);

    if (volBar) {
      volBar.addEventListener('input', function () {
        const val = parseFloat(this.value);
        globalAudioEl.volume = val;
        this.style.setProperty('--vol-progress', (val * 100) + '%');
        if (val > 0) lastVolume = val;
      });
    }

    if (volBtn) {
      volBtn.addEventListener('click', function () {
        if (globalAudioEl.volume > 0) {
          lastVolume = globalAudioEl.volume;
          globalAudioEl.volume = 0;
          volBar.value = 0;
          volBar.style.setProperty('--vol-progress', '0%');
        } else {
          const target = lastVolume || 1;
          globalAudioEl.volume = target;
          volBar.value = target;
          volBar.style.setProperty('--vol-progress', (target * 100) + '%');
        }
      });
    }

    // ── Global Delegated Track Click ──
    document.addEventListener('click', function (e) {
      const trackEl = e.target.closest('.Track_track__b2YEg[data-audio-url]');
      if (!trackEl) return;
      const url = trackEl.getAttribute('data-audio-url');
      if (url && url !== '#' && url.toLowerCase() !== 'n/a') {
        if (e.metaKey || e.ctrlKey) return;

        e.preventDefault();
        playOrOpen(url, trackEl);
      }
    });

    // ── Custom Right-Click Context Menu (Image 2) ──
    let ctxTargetTrack = null;

    document.addEventListener('contextmenu', function (e) {
      const trackEl = e.target.closest('.Track_track__b2YEg');
      if (!trackEl) return;

      const audioUrl = trackEl.getAttribute('data-audio-url');
      if (!audioUrl || audioUrl === '#' || audioUrl.toLowerCase() === 'n/a') {
        return;
      }

      e.preventDefault();
      ctxTargetTrack = trackEl;

      const menu = document.getElementById('custom-context-menu');
      const size = trackEl.getAttribute('data-track-size') || '';
      const downloadText = document.getElementById('ctx-download-text');
      if (downloadText) {
        downloadText.textContent = size ? `Download (${size})` : 'Download';
      }

      const copyText = document.getElementById('ctx-copy-text');
      if (copyText) copyText.textContent = 'Copy Link';

      menu.style.display = 'block';
      const menuWidth = 190;
      const menuHeight = 120;
      let left = e.clientX;
      let top = e.clientY;

      if (left + menuWidth > window.innerWidth) {
        left = window.innerWidth - menuWidth - 10;
      }
      if (top + menuHeight > window.innerHeight) {
        top = window.innerHeight - menuHeight - 10;
      }

      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
    });

    document.addEventListener('click', function (e) {
      if (!e.target.closest('#custom-context-menu')) {
        const menu = document.getElementById('custom-context-menu');
        if (menu) menu.style.display = 'none';
      }
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const menu = document.getElementById('custom-context-menu');
        if (menu) menu.style.display = 'none';
      }
    });

    document.getElementById('ctx-copy-link')?.addEventListener('click', async function () {
      if (!ctxTargetTrack) return;
      const url = ctxTargetTrack.getAttribute('data-audio-url');
      if (url) {
        try {
          await navigator.clipboard.writeText(url);
          const copyText = document.getElementById('ctx-copy-text');
          if (copyText) {
            copyText.textContent = 'Copied!';
            setTimeout(() => {
              const menu = document.getElementById('custom-context-menu');
              if (menu) menu.style.display = 'none';
            }, 600);
          }
        } catch (err) {
          console.error('Copy failed:', err);
        }
      }
    });

    document.getElementById('ctx-open-url')?.addEventListener('click', function () {
      if (!ctxTargetTrack) return;
      const url = ctxTargetTrack.getAttribute('data-audio-url');
      if (url) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
      const menu = document.getElementById('custom-context-menu');
      if (menu) menu.style.display = 'none';
    });

    document.getElementById('ctx-download')?.addEventListener('click', async function () {
      if (!ctxTargetTrack) return;
      const url = ctxTargetTrack.getAttribute('data-audio-url');
      if (url) {
        try {
          const res = await fetch('/api/resolve?url=' + encodeURIComponent(url));
          let dlUrl = url;
          if (res.ok) {
            const data = await res.json();
            if (data.resolved) dlUrl = data.resolved;
          }
          const a = document.createElement('a');
          a.href = dlUrl;
          a.download = (ctxTargetTrack.getAttribute('data-track-name') || 'audio') + '.mp3';
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        } catch (e) {
          window.open(url, '_blank');
        }
      }
      const menu = document.getElementById('custom-context-menu');
      if (menu) menu.style.display = 'none';
    });

    // ── Search Handler ──
    function initSearch() {
      const searchInput = document.getElementById('search-input');
      const resultsBox = document.getElementById('search-results');
      const resultsInner = document.getElementById('search-results-inner');
      if (!searchInput || !resultsBox || !resultsInner) return;

      const allTracks = Array.from(document.querySelectorAll('.EraCard_tracks__UJDwG .Track_track__b2YEg, .unreleased_container__2SPrV .Track_track__b2YEg'));

      searchInput.addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        if (!q) {
          resultsBox.style.display = 'none';
          return;
        }

        const hits = allTracks.filter(el => {
          const name = el.querySelector('.track-title')?.textContent?.toLowerCase() || el.getAttribute('data-track-name')?.toLowerCase() || '';
          const artists = el.querySelector('.Track_artists__94fRt')?.textContent?.toLowerCase() || el.getAttribute('data-track-artists')?.toLowerCase() || '';
          const notes = (el.dataset.content || '').toLowerCase();
          return name.includes(q) || artists.includes(q) || notes.includes(q);
        });

        resultsInner.innerHTML = '';
        if (!hits.length) {
          resultsInner.innerHTML = '<p style="padding:8px;color:lightgray">No results found.</p>';
        } else {
          hits.slice(0, 60).forEach(el => resultsInner.appendChild(el.cloneNode(true)));
          restorePlayedTracks();
        }
        resultsBox.style.display = 'block';
      });
    }

    initSearch();

    // ── Seamless SPA Page Transitions (Audio Keeps Playing Uninterrupted) ──
    async function spaNavigate(url, push = true) {
      try {
        const res = await fetch(url);
        if (!res.ok) {
          window.location.href = url;
          return;
        }
        const htmlText = await res.text();
        const parser = new DOMParser();
        const newDoc = parser.parseFromString(htmlText, 'text/html');

        // 1. Update document title
        if (newDoc.title) {
          document.title = newDoc.title;
        }

        // 2. Synchronize dynamic page-specific stylesheets & styles from newDoc's <head>
        document.querySelectorAll('head [data-page-css="true"]').forEach(el => el.remove());
        newDoc.head.querySelectorAll('link[rel="stylesheet"], style').forEach(el => {
          const href = el.getAttribute('href') || '';
          if (!href.includes('global.css')) {
            const clone = el.cloneNode(true);
            clone.setAttribute('data-page-css', 'true');
            document.head.appendChild(clone);
          }
        });

        // 3. Swap scrollable content
        const newScrollable = newDoc.getElementById('scrollable');
        const curScrollable = document.getElementById('scrollable');
        if (newScrollable && curScrollable) {
          curScrollable.innerHTML = newScrollable.innerHTML;
          curScrollable.scrollTop = 0;
        } else {
          window.location.href = url;
          return;
        }

        // 4. Update history
        if (push) {
          window.history.pushState({ url: url }, '', url);
        }

        // 5. Update header navigation active tab states
        const newNavLinks = newDoc.querySelectorAll('.Links_links__UToMx a, .Header_links__rYnfM a');
        const curNavLinks = document.querySelectorAll('.Links_links__UToMx a, .Header_links__rYnfM a');
        if (newNavLinks.length === curNavLinks.length) {
          curNavLinks.forEach((a, idx) => {
            a.className = newNavLinks[idx].className;
          });
        }

        // 6. Re-init search & played states
        initSearch();
        restorePlayedTracks();

      } catch (e) {
        console.error('SPA navigation error:', e);
        window.location.href = url;
      }
    }

    window.addEventListener('popstate', function () {
      spaNavigate(window.location.href, false);
    });

    document.addEventListener('click', function (e) {
      const link = e.target.closest('a[href]');
      if (!link) return;

      const href = link.getAttribute('href');
      const target = link.getAttribute('target');

      if (!href || href.startsWith('#') || href.startsWith('javascript:') || target === '_blank' || link.hasAttribute('download')) {
        return;
      }

      if (link.hostname === window.location.hostname || href.startsWith('/')) {
        e.preventDefault();
        spaNavigate(href, true);
      }
    });
  </script>
  {% block scripts %}{% endblock %}
</body>

</html>
