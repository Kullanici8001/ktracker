{% extends "base.html" %}

{% block title %}Error | KTracker{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;padding:40px 20px;text-align:center;gap:16px;">
  <div style="font-size:48px"></div>
  <h1 style="font-size:24px;font-weight:700;">An error occurred</h1>
  <pre style="background:rgb(24,24,24);border:1px solid rgba(255,255,255,.1);border-radius:6px;padding:16px;font-size:13px;color:#e73c3c;max-width:600px;white-space:pre-wrap;word-break:break-all;">{{ error }}</pre>
  <p style="color:lightgray;font-size:13px;max-width:460px;">
    Make sure the Google Sheet is <strong>publicly accessible</strong>:<br>
    File - Share - Anyone with the link - Viewer
  </p>
  <p style="font-size:13px;color:rgba(255,255,255,.4)">Sheet ID: {{ sheet_id }}</p>
  <a href="/" style="color:#2ca869;font-size:14px;">← Back to Home</a>
</div>
{% endblock %}
